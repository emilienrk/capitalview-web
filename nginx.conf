server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Report-only until a bank link has run clean under it: violations are logged
    # in the browser console, nothing is blocked. The sha256 is the theme boot
    # script in index.html (csp.spec.ts fails if they drift); __API_ORIGIN__ is
    # filled from VITE_API_URL at image build.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-Ajd5248fvFtji8DZZ4r2KvnCBRi2Fq7jOFEtlQ2rjXA=' https://stats.capitalview.fr https://auth.enablebanking.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://auth.enablebanking.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://enablebanking.com https://*.enablebanking.com; connect-src 'self' __API_ORIGIN__ https://stats.capitalview.fr https://*.enablebanking.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
